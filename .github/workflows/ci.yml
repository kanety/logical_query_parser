name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lqp_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d lqp_test" --health-interval 10s --health-timeout 5s --health-retries 5
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: lqp_test
          MYSQL_USER: mysql
          MYSQL_PASSWORD: mysql
        ports:
          - 3306:3306
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 --silent" --health-interval 20s --health-timeout 10s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.0', 3.1, 3.2, 3.3, 3.4, '4.0']
        gemfile: ['rails70', 'rails71', 'rails72', 'rails80', 'rails81']
        database: ['sqlite', 'mysql', 'postgresql']
        exclude:
          - ruby: 3.0
            gemfile: rails72
          - ruby: 3.0
            gemfile: rails80
          - ruby: 3.0
            gemfile: rails81
          - ruby: 3.1
            gemfile: rails80
          - ruby: 3.1
            gemfile: rails81

    name: ruby ${{ matrix.ruby }}, ${{ matrix.gemfile }}, ${{ matrix.database }}

    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile

    steps:
    - uses: actions/checkout@v5
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Bundle list
      run: |
        bundle list
    - name: Test for sqlite
      if: matrix.database == 'sqlite'
      run: |
        DEBUG=1 bundle exec rspec
    - name: Test for postgresql
      if: matrix.database == 'postgresql'
      run: |
        DEBUG=1 DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/lqp_test bundle exec rspec
    - name: Test for mysql
      if: matrix.database == 'mysql'
      run: |
        DEBUG=1 DATABASE_URL=mysql2://mysql:mysql@127.0.0.1:3306/lqp_test bundle exec rspec
